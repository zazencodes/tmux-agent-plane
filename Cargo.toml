[package]
name = "tmux-agent-plane"
version = "0.6.1"
edition = "2024"
rust-version = "1.88"
description = "See and steer coding agents running in your tmux"
license = "GPL-3.0-only"
repository = "https://github.com/zazencodes/tmux-agent-plane"
readme = "README.md"
keywords = ["tmux", "claude-code", "codex", "ai-agents", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["docs/assets"]

[dependencies]
ansi-to-tui = "8.0.1"
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
